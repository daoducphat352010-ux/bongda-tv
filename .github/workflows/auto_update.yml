name: Auto Update Football Feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-update-bongda-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install playwright requests beautifulsoup4 lxml
          fi
          python -m playwright install chromium --with-deps || python -m playwright install chromium

      - name: Run scraper.py
        run: python scraper.py

      - name: Commit and push updated feed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: auto update feed.json"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push retry $i..."
            sleep 3
          done
