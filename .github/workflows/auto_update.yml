name: Auto Update Football Feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-update-football-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

- name: Run scrapers
        run: |
          python scraper.py
          python scraper_giovang.py

      - name: Commit and push updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add feed.json giovang_feed.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update feeds"
            git push
          else
            echo "No changes in feeds"
          fi
